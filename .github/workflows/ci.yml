# CI (#22): pri kazdom pushi a pull requeste build, typova kontrola a testy API
# proti skutocnej PostgreSQL. Testy pouzivaju len synteticke udaje.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platforma — typy, build, testy API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: process_platform
          POSTGRES_USER: process_user
          POSTGRES_PASSWORD: process_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U process_user -d process_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: process-platform-angular

    env:
      DATABASE_URL: postgresql://process_user:process_password@localhost:5432/process_platform?schema=public
      # testy uloziska kontroluju subory na disku — koren aplikacie v CI
      APP_DIR: ${{ github.workspace }}/process-platform-angular
      API_URL: http://localhost:3000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: process-platform-angular/package-lock.json

      - name: Zavislosti
        run: npm ci

      - name: Prisma klient a migracie
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Typova kontrola (klient + server)
        run: npm run typecheck

      - name: Build aplikacie
        run: npm run build

      - name: Spustenie API
        run: |
          nohup npx tsx server/index.ts > api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/translations > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "API nenabehlo:"; cat api.log; exit 1

      - name: Testy API (izolacia firiem, ulozisko, organizacia, backoffice)
        run: npm run test:api

      - name: Log API pri chybe
        if: failure()
        run: cat api.log || true

  backoffice:
    name: Backoffice — build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: process-platform-backoffice

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: process-platform-backoffice/package-lock.json

      - name: Zavislosti
        run: npm ci

      - name: Build
        run: npm run build

  production-image:
    name: Produkčný obraz — build a smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracia (synteticke tajomstva len pre CI)
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 16)"
            echo "APP_URL=http://127.0.0.1:3000"
          } > deploy/.env

      - name: Build a start
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

      - name: Cakanie na aplikaciu
        run: |
          for attempt in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/translations > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Smoke test
        run: |
          set -e
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          test "$(code http://127.0.0.1:3000/)" = 200
          curl -s http://127.0.0.1:3000/app/processes | grep -q '<pp-root>'
          # API operatora na verejnom porte nie je
          test "$(code http://127.0.0.1:3000/api/backoffice/health)" = 404
          # chranene API bez prihlasenia
          test "$(code http://127.0.0.1:3000/api/organizations/x/processes)" = 401
          # backoffice na vlastnom porte
          test "$(code http://127.0.0.1:4300/)" = 200
          test "$(code http://127.0.0.1:4300/api/backoffice/health)" = 401
          # zostavene subory s hashom sa cachuju, index nie
          asset=$(curl -s http://127.0.0.1:3000/ | grep -o 'main-[A-Z0-9]*\.js' | head -1)
          curl -sI "http://127.0.0.1:3000/$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          curl -sI http://127.0.0.1:3000/ | grep -qi 'cache-control: no-cache'
          # tajomstva a prvy admin vznikli v zvazku /data, nie v obraze
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env exec -T app test -s /data/secrets.json
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env exec -T app test -s /data/initial-backoffice-password.txt
          echo "Smoke test OK"

      - name: Log pri chybe
        if: failure()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs --no-color app | tail -100

      - name: Upratanie
        if: always()
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env down -v
