# Produkcne nasadenie (SaaS aj on-premise). Navod: docs/DEPLOYMENT.md
#   cp deploy/.env.example deploy/.env   # vyplnit hesla a tajomstva
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Porty su naviazane len na 127.0.0.1 — verejne ide len aplikacia cez reverznu
# proxy s TLS (deploy/nginx.conf.example). Backoffice je dostupny iba lokalne,
# cez SSH tunel alebo VPN.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-processbase}
      POSTGRES_USER: ${POSTGRES_USER:-processbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nastavte POSTGRES_PASSWORD v deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-processbase} -d ${POSTGRES_DB:-processbase}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-processbase}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-processbase}?schema=public
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4300:4300"
    volumes:
      - appdata:/data

volumes:
  pgdata:
  appdata:
