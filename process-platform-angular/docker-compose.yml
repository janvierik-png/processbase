services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: process_platform
      POSTGRES_USER: process_user
      POSTGRES_PASSWORD: process_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U process_user -d process_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://process_user:process_password@postgres:5432/process_platform?schema=public
      CAMUNDA7_BASE_URL: http://host.docker.internal:8080/engine-rest
      CAMUNDA7_USERNAME: ""
      CAMUNDA7_PASSWORD: ""
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - angular_node_modules:/app/node_modules
    # migrate deploy = aplikuje migracie, generate = Prisma klient pre Linux, seed = demo data + backoffice admin
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run db:seed && npm run api"

  angular:
    build:
      context: .
      target: dev
    depends_on:
      api:
        condition: service_started
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - angular_node_modules:/app/node_modules
    command: npm run frontend

  backoffice:
    build:
      context: ../process-platform-backoffice
      target: dev
    depends_on:
      api:
        condition: service_started
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "4300:4300"
    volumes:
      - ../process-platform-backoffice:/app
      - backoffice_node_modules:/app/node_modules
    command: npm start

volumes:
  angular_node_modules:
  backoffice_node_modules:
  postgres_data:
