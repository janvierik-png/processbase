<section class="documents-page">
  <header>
    <p class="eyebrow">Dokumenty</p>
    <h2>Zoznam dokumentov</h2>
  </header>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <section class="documents-table">
    <div class="table-head">
      <span>Nazov</span>
      <span>Proces</span>
      <span>Typ</span>
      <span>Velkost</span>
      <span></span>
    </div>
    @for (document of documents(); track document.id) {
      <div class="table-row">
        <strong>{{ document.name }}</strong>
        <span>{{ document.processName || '-' }}</span>
        <span>{{ document.type }}</span>
        <span>{{ document.size || 0 }} B</span>
        <button type="button" (click)="deleteDocument(document)">Vymazat</button>
      </div>
    } @empty {
      <p class="empty">Zatial nie su nahrate ziadne dokumenty.</p>
    }
  </section>
</section>
